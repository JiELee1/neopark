jwt:
  secret:
    access: "${JWT_SECRET_ACCESS}"
    refresh: "${JWT_SECRET_REFRESH}"

spring:
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"

  # 환경변수를 통해 설정하는 대신, 테스트용으로 직접 값을 지정합니다.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3308/mydatabase}"
    username: "${DB_USERNAME:dbuser}"
    password: "${DB_PASSWORD:dbpassword}"                   # 테스트용 DB 비밀번호

  # 불필요한 보안 설정은 주석 처리
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: dummy-google-client-id
  #           client-secret: dummy-google-client-secret
  #           scope: profile,email

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show-sql: true
        format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # servlet 관련 설정은 테스트에 필요하지 않으므로 주석 처리
  # servlet:
  #   multipart:
  #     enabled: true
  #     max-file-size: 10MB
  #     max-request-size: 10MB

# JWT 관련 설정 주석 처리 (테스트 코드에서는 사용하지 않음)
