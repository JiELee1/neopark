services:
  mysql:
    image: mysql:8.0.31
    ports:
      - "3308:3306"    # 호스트 포트 3308 → 컨테이너 포트 3306
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
      TZ: Asia/Seoul
    volumes:
      - intermark:/var/lib/mysql
    restart: always

volumes:
  intermark:
